[package]
edition = "2021"
name = "challenge"
version = "0.1.0"

[dependencies]
odra = { version = "2.8.0", features = [], default-features = false }
odra-casper-livenet-env = { version = "2.8.0", optional = true }

[features]
livenet = ["odra-casper-livenet-env"]

[dev-dependencies]
odra-test = { version = "2.8.0", features = [], default-features = false }
credential_registry = { path = "../credential-registry" }
groth16_verifier = { path = "../groth16-verifier" }

[build-dependencies]
odra-build = { version = "2.8.0", features = [], default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
odra-build = { version = "2.8.0", features = [], default-features = false }
odra-cli = { version = "2.8.0", features = [], default-features = false }

[[bin]]
name = "challenge_build_contract"
path = "bin/build_contract.rs"
test = false

[[bin]]
name = "challenge_build_schema"
path = "bin/build_schema.rs"
test = false

[[bin]]
name = "livenet_challenge"
path = "bin/livenet_challenge.rs"
required-features = ["livenet"]
test = false

[profile.release]
codegen-units = 1
lto = true

[profile.dev.package."*"]
opt-level = 3
