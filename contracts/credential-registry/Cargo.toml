[package]
edition = "2021"
name = "credential_registry"
version = "0.1.0"

[dependencies]
odra = { version = "2.8.0", features = [], default-features = false }
odra-modules = { version = "2.8.0", features = [], default-features = false }
odra-casper-livenet-env = { version = "2.8.0", optional = true }

[features]
livenet = ["odra-casper-livenet-env"]

[dev-dependencies]
odra-test = { version = "2.8.0", features = [], default-features = false }

[build-dependencies]
odra-build = { version = "2.8.0", features = [], default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
odra-build = { version = "2.8.0", features = [], default-features = false }
odra-cli = { version = "2.8.0", features = [], default-features = false }

[[bin]]
name = "credential_registry_build_contract"
path = "bin/build_contract.rs"
test = false

[[bin]]
name = "credential_registry_build_schema"
path = "bin/build_schema.rs"
test = false

[[bin]]
name = "credential_registry_cli"
path = "bin/cli.rs"
test = false

[[bin]]
name = "livenet_read"
path = "bin/livenet_read.rs"
required-features = ["livenet"]
test = false

[profile.release]
codegen-units = 1
lto = true

[profile.dev.package."*"]
opt-level = 3
