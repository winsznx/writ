[package]
edition = "2021"
name = "groth16_verifier"
version = "0.1.0"

[dependencies]
odra = { version = "2.8.0", features = [], default-features = false }
ark-bn254 = { version = "0.5", default-features = false, features = ["curve"] }
ark-groth16 = { version = "0.5", default-features = false }
ark-serialize = { version = "0.5", default-features = false }
ark-std = { version = "0.5", default-features = false }

[dev-dependencies]
ark-ec = { version = "0.5", default-features = false }
ark-ff = { version = "0.5", default-features = false }
odra-test = { version = "2.8.0", features = [], default-features = false }

[build-dependencies]
odra-build = { version = "2.8.0", features = [], default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
odra-build = { version = "2.8.0", features = [], default-features = false }
odra-cli = { version = "2.8.0", features = [], default-features = false }

[[bin]]
name = "groth16_verifier_build_contract"
path = "bin/build_contract.rs"
test = false

[[bin]]
name = "groth16_verifier_build_schema"
path = "bin/build_schema.rs"
test = false

[profile.release]
codegen-units = 1
lto = true

[profile.dev.package."*"]
opt-level = 3
