[package]
edition = "2021"
name = "writ_integration"
version = "0.1.0"

# Test-only crate: it owns no contract, it composes the five Writ contracts
# (from path dev-deps) against ONE registry and proves the full lifecycle.

[dev-dependencies]
odra = { version = "2.8.0", features = [], default-features = false }
odra-test = { version = "2.8.0", features = [], default-features = false }
credential_registry = { path = "../credential-registry" }
groth16_verifier = { path = "../groth16-verifier" }
challenge = { path = "../challenge" }
transfer_filter = { path = "../transfer-filter" }
writ_token = { path = "../writ-token" }

[profile.dev.package."*"]
opt-level = 3
