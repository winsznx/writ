[package]
name = "ark-verifier"
version = "0.1.0"
edition = "2021"

[lib]
name = "ark_verifier"
path = "src/lib.rs"

[dependencies]
ark-bn254 = "0.5"
ark-groth16 = { version = "0.5", default-features = false }
ark-ec = "0.5"
ark-ff = "0.5"
ark-serialize = "0.5"
num-bigint = "0.4"
serde_json = "1"

[[bin]]
name = "ark-verify"
path = "src/main.rs"
